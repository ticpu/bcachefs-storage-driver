name: release

# Cut a release by pushing a tag: `git tag v5.7.0-bcachefs1 && git push --tags`.
# The packages are (re)built and verified by the same pipeline CI uses, then the
# .deb / .pkg.tar.zst files are attached to a GitHub Release. workflow_dispatch
# allows a manual run against an explicit tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create/publish the release for
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every artifact from the reusable build workflow (noble-debs,
      # resolute-debs, trixie-debs, arch-pkgs), each under its own subdirectory.
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release
          # Debug/dbgsym packages are large and rarely wanted in a release.
          find dist -type f \( -name '*.deb' -o -name '*.pkg.tar.zst' \) \
            ! -name '*debug*' ! -name '*dbgsym*' -exec cp -t release {} +

          count=$(find release -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "no packages assembled"; exit 1; }
          echo "assembled $count package(s):"
          ls -1 release

          # Which suite each .deb belongs to. podman and containers-storage are
          # rebuilt per distro and carry that distro's upstream version, so the
          # filenames cannot be told apart; only the artifact directory knows.
          find dist -type f -name '*.deb' ! -name '*debug*' ! -name '*dbgsym*' -printf '%h\t%f\n' \
            | sed -E 's|^dist/([^/-]+)-debs\t|\1\t|' \
            | jq -Rn '[inputs | split("\t") | {file: .[1], suite: .[0]}]' > release/manifest.json
          jq -e 'length > 0 and all(.[].suite | test("^[a-z]+$"))' release/manifest.json > /dev/null
          cat release/manifest.json

          ( cd release && sha256sum -- * > SHA256SUMS )

      # Install goes through apt.ticpu.net and the AUR, so the notes name no
      # filenames. dist/ is still read, to fail a release whose notes would
      # describe a platform that produced nothing.
      - name: Generate release notes
        run: |
          set -euo pipefail
          .github/release-notes.sh dist > NOTES.md
          cat NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"

          # Left as a draft: sign-release.sh detach-signs the assets locally and
          # publishes. The signing key never reaches CI, and immutable releases
          # refuse asset changes once published.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes-file NOTES.md
          else
            gh release create "$tag" release/* \
              --draft --title "$tag" --notes-file NOTES.md
          fi
